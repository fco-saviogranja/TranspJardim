<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Lupa: anel -->
  <circle cx="45" cy="45" r="32" fill="none" stroke="#1e5fa8" stroke-width="8"/>

  <!-- Barras dentro da lente -->
  <rect x="30" y="46" width="7" height="16" fill="#1e5fa8" rx="1.5"/>
  <rect x="42" y="34" width="7" height="28" fill="#0e9e6e" rx="1.5"/>
  <rect x="54" y="40" width="7" height="22" fill="#1e5fa8" rx="1.5"/>

  <!-- Cabo -->
  <line x1="69" y1="69" x2="90" y2="91" stroke="#1e5fa8" stroke-width="8" stroke-linecap="round"/>

  <!-- Ponto verde no cabo -->
  <circle cx="90" cy="91" r="6" fill="#0e9e6e"/>

</svg>
