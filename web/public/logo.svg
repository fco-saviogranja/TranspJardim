<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Handle -->
  <line x1="330" y1="330" x2="450" y2="450" stroke="#052A66" stroke-width="60" stroke-linecap="round"/>
  
  <!-- Glass Lens (White bg) and Rim -->
  <circle cx="220" cy="220" r="170" fill="#FFFFFF" stroke="#052A66" stroke-width="35"/>
  
  <!-- Bars -->
  <!-- Left (Small/Dark) -->
  <rect x="110" y="250" width="45" height="100" rx="4" fill="#052A66"/>
  <!-- Middle (Medium/Green) -->
  <rect x="175" y="190" width="45" height="160" rx="4" fill="#10A97A"/>
  <!-- Right (Tall/Green) -->
  <rect x="240" y="130" width="45" height="220" rx="4" fill="#10A97A"/>
  
  <!-- Checkmark (White outline for separation + Green stroke) -->
  <path d="M80 260 L160 340 L360 140" fill="none" stroke="#FFFFFF" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 260 L160 340 L360 140" fill="none" stroke="#10A97A" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>